start_bypass:
  fields:
    zones:
      example: ["climate.studio"]
      selector:
        entity:
          domain: climate
          multiple: true
    temperature:
      example: 22.5
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    offset:
      example: 1
      selector:
        number:
          min: -10
          max: 10
          step: 0.5
          unit_of_measurement: "°C"
    duration:
      example: 60
      selector:
        text:
    until:
      example: "2026-11-02T22:00:00+01:00"
      selector:
        text:
    source:
      example: "automation"
      selector:
        text:

